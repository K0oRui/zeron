name: cleanup

# Keep the Actions tab and the cache storage usable: after any CI workflow
# finishes, drop every run but the latest per workflow and every cache but
# the most recently accessed one (10 GB repo limit).
on:
  workflow_run:
    workflows: [
      "Cursor compatibility",
      "Cursor SDK updates",
      "deploy",
      "Linux installer",
      "macOS tests",
      "Native Codex voice",
      "Preview networking",
      "Release-profile tests",
      "release",
      "TestFlight",
      "UI tests",
      "Windows tests",
    ]
    types: [completed]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # One cleanup at a time. A started purge is allowed to finish: cancelling
    # it mid-list restarts from the top and never drains a backlog. Triggers
    # that arrive while it runs collapse into one pending run.
    concurrency:
      group: cleanup
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Purge old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # GitHub answers 502/503 transiently under load; retry before giving
          # up so one bad response does not fail the whole cleanup.
          delete_run() {
            for attempt in 1 2 3 4 5; do
              if gh api -X DELETE "$1" >/dev/null 2>&1; then return 0; fi
              sleep $((attempt * 2))
            done
            echo "::warning::could not delete $1"
          }
          for workflow in $(gh api "/repos/$REPO/actions/workflows" --jq '.workflows[].id'); do
            count=$(gh api "/repos/$REPO/actions/workflows/$workflow/runs?per_page=1" --jq '.total_count')
            [ "$count" -le 1 ] && continue
            # Keep the newest run overall; delete older runs only once they
            # are completed. Deleting a queued or in-progress run answers
            # 403 and aborts the whole step.
            gh api "/repos/$REPO/actions/workflows/$workflow/runs?per_page=100" --jq '.workflow_runs' \
              | jq -r 'sort_by(.run_number) | reverse | .[1:] | map(select(.status == "completed")) | .[].id' \
              | while read -r id; do
                  [ -z "$id" ] || delete_run "/repos/$REPO/actions/runs/$id"
                done
          done

      - name: Purge old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Caches are deleted in parallel: a backlog can run to thousands,
          # and a serial loop never drains it before the next run starts.
          # A cache that survives the retries only costs storage, so warn
          # instead of failing CI.
          gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.last_accessed_at)"' \
            | sort -k2 -r \
            | tail -n +2 \
            | awk '{print $1}' \
            | xargs -r -P 16 -I{} bash -c '
                for attempt in 1 2 3; do
                  if gh api -X DELETE "$0" >/dev/null 2>&1; then exit 0; fi
                  sleep $((attempt * 2))
                done
                echo "::warning::could not delete $0"' \
                "/repos/$REPO/actions/caches/{}"
