name: release

# Build release artifacts and publish them to this repository's GitHub Release:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package/package-macos.sh
#   - Windows per-user installer, portable zip, and updater exe (x86_64) via
#     scripts/package/package-windows.ps1
# The release is the only release feed: the in-app updater reads
# api.github.com/repos/<repo>/releases/latest and downloads the assets through
# their github.com release URLs, and manifest.json below supplies the sha256 it
# verifies them against. Nothing is mirrored to R2 or zeron.sh any more.
#
# Trigger / publish rule (no manual tagging):
#   push to main        → publish iff the workspace version in Cargo.toml is
#                         STRICTLY NEWER than the latest published release tag;
#                         otherwise the run stops after the `version` job (~5s,
#                         no builds) and logs "already published: vX".
#   push of tag `v*`    → always publish (deliberate republish / force escape
#                         hatch, see the `version` job for details).
#   workflow_dispatch   → same version rule as a push to main, i.e. it publishes
#                         when the Cargo.toml version is not published yet.
# The release tag is always `v<Cargo.toml version>`, which is what the updater's
# releases/latest lookup expects; softprops/action-gh-release creates that tag
# at the built commit if it does not exist yet.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Serialise overlapping pushes (two merges in quick succession) instead of
# letting them race on the same release. Runs that queue up usually become
# no-ops once the first one publishes the version (their `version` job then
# reports publish=false) — that is the intended behaviour, not a bug.
# There is no trigger loop to worry about: creating a release does not emit a
# push event, and this workflow only runs on push/workflow_dispatch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run publishes at all. Cheap on purpose: an unchanged
  # version must cost one short job and no builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: resolve Cargo.toml version and publish decision
        id: version
        env:
          # Needed by `gh release view`; the workflow-level `contents: write`
          # permission covers the read.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The workspace version is the first `^version = "` line of Cargo.toml,
          # i.e. [workspace.package] version.
          # (`|| true`: without it, `set -e`/pipefail would abort on a missing
          # line before the explicit, loud failure below.)
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/' || true)"
          if [ -z "${version:-}" ]; then
            echo "::error::Cargo.toml has no parseable 'version = \"x.y.z\"' line"
            exit 1
          fi
          if ! printf '%s' "$version" |
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "::error::Cargo.toml version '$version' is not x.y.z"
            exit 1
          fi
          echo "workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          publish=false
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            # A tag push bypasses the "newer than latest" check entirely: it is
            # the deliberate escape hatch, so re-pushing an existing tag
            # republishes that version (and can even publish a version that is
            # older than, or equal to, the latest release).
            echo "tag push ${GITHUB_REF} → publish=true"
            publish=true
          else
            latest=""
            err="$(mktemp)"
            if latest="$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq .tagName 2>"$err")"; then
              :
            else
              rc=$?
              # `gh release view` exits non-zero with "release not found"
              # (HTTP 404) when the repository has no releases yet — the one
              # failure tolerated here. Anything else is a real error and must
              # fail the job rather than quietly skip publishing.
              if grep -qi 'release not found' "$err"; then
                echo "no releases yet"
                latest=""
              else
                echo "::error::gh release view failed (exit $rc): $(tr '\n' ' ' <"$err")"
                exit 1
              fi
            fi
            latest="${latest#v}"
            echo "latest published: ${latest:-<none>}"

            if [ -z "$latest" ]; then
              # Nothing published yet: whatever Cargo.toml says becomes the
              # first release.
              publish=true
            elif [ "$version" = "$latest" ]; then
              publish=false
            elif [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" = "$version" ]; then
              # Strictly newer, compared version-wise (`sort -V`, not string
              # compare: 0.2.100 is newer than 0.2.99).
              publish=true
            else
              publish=false
            fi

            if [ "$publish" = "false" ]; then
              # A version equal to or older than the latest release never
              # publishes on its own. Forcing it requires a manual tag push of
              # v$version (which takes the bypass above) or deleting the
              # existing release.
              echo "already published: v$latest (Cargo.toml has $version) — skipping builds"
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "### release: $([ "$publish" = "true" ] && echo publishing || echo skipping) v$version"
            echo ""
            echo "- workspace version: \`$version\`"
            echo "- publish: \`$publish\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cursor-compatibility:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/cursor-compatibility.yml

  linux:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package
        # `bash <script>`, never the bare path: the checkout's exec bit is not
        # something a release can depend on.
        run: bash scripts/package/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # Every platform must build before publishing the release and updater manifest.
  #
  # Signing/notarization (both optional — absent secrets fall back to an
  # ad-hoc-signed build):
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  # They live in the `apple-release` environment, which only release tags and
  # main may use: a run from any other branch gets no environment, so no
  # credentials, and builds ad-hoc-signed.
  macos:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest # Apple silicon
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'apple-release' || '' }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        # See the Linux job: run the script through bash, not its exec bit.
        run: bash scripts/package/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package installer and portable app
        run: ./scripts/package/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  publish:
    # Cannot run when the `version` job decided not to publish (unchanged or
    # older version, no tag push).
    needs: [version, cursor-compatibility, linux, macos, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: version guard (artifacts match the Cargo.toml version)
        env:
          # The single source of truth: the `version` job's output (never
          # derived from the ref here).
          VERSION_RESOLVED: ${{ needs.version.outputs.version }}
        run: |
          ver="$VERSION_RESOLVED"
          [ -n "$ver" ] || { echo "no version output from the version job"; exit 1; }
          ls dist/
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64.exe windows-x86_64-setup.exe; do
            test -f "dist/zeron-$ver-$platform" \
              || { echo "missing artifact for v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        # manifest.json is the updater's checksum source: the in-app update
        # checks (crates/update) read it from this release and verify every
        # artifact against its sha256 before installing.
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist/*; do
            [ -f "$f" ] || continue
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s\n' "$manifest" > manifest.json
          cat manifest.json
      # Creates tag v<version> at this commit when it does not exist yet, which
      # is what removes the manual tagging step from the release flow.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            dist/*
            manifest.json
          generate_release_notes: true
          make_latest: true
